name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Security Checks
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: mysite.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install dependencies
        run: |
          cd portfolai
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pylint flake8

      - name: Run migrations
        run: |
          cd portfolai
          python manage.py makemigrations
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          cd portfolai
          python manage.py collectstatic --noinput

      - name: Run Bandit Security Scan
        run: |
          cd portfolai
          echo "=== Bandit Security Scan ==="
          bandit -r core -f json -o bandit.json -c bandit.yaml || true
          echo ""
          echo "=== Bandit Summary ==="
          if [ -f bandit.json ]; then
            python << 'EOF'
          import json
          with open('bandit.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          high = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
          med = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
          low = sum(1 for r in results if r.get('issue_severity') == 'LOW')
          print(f'HIGH: {high}, MEDIUM: {med}, LOW: {low}, Total: {len(results)}')
          EOF
          fi

      - name: Check for high severity Bandit issues
        run: |
          cd portfolai
          if [ -f bandit.json ]; then
            python << 'EOF'
          import json
          with open('bandit.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          high_count = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
          exit(1 if high_count > 0 else 0)
          EOF
          fi

      - name: Run PyLint Code Quality Check
        run: |
          cd portfolai
          echo "=== PyLint Code Quality Check ==="
          python -m pylint core --fail-on=E,F

      - name: Run Flake8 Style Check
        run: |
          cd portfolai
          echo "=== Flake8 Style Check ==="
          flake8 core --format=default || true

      - name: Run Safety Dependency Vulnerability Check
        run: |
          cd portfolai
          echo "=== Safety Dependency Vulnerability Check ==="
          safety check -r requirements.txt || true

      - name: Run Code Coverage Check
        run: |
          cd portfolai
          echo "=== Code Coverage Check ==="
          pytest -v --cov=core --cov-report=term-missing --cov-fail-under=80 --timeout=30 --timeout-method=thread

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

